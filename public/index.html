<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC Video Call</title>

<style>

/************* PAGE *************/
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#020617,#0f172a);
color:white;
display:flex;
flex-direction:column;
align-items:center;
height:100vh;
}

/************* HEADER *************/
header{
margin-top:20px;
text-align:center;
}

header h2{
margin:5px;
}

/************* ROOM CONTROLS *************/
.room-box{
margin-top:10px;
}

#room{
padding:10px;
border-radius:8px;
border:none;
outline:none;
width:160px;
}

.join-btn{
padding:10px 18px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
transition:0.2s;
}

.join-btn:hover{
background:#1d4ed8;
}

/************* VIDEO AREA *************/
.video-container{
flex:1;
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
padding:20px;
}

/************* VIDEO CARD *************/
.video-card{
position:relative;
border-radius:12px;
overflow:hidden;
background:black;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

video{
width:420px;
max-width:45vw;
border-radius:12px;
}

/************* LOCAL VIDEO MIRROR *************/
#localVideo{
transform:scaleX(-1);
}

/************* LABEL *************/
.label{
position:absolute;
bottom:10px;
left:10px;
background:rgba(0,0,0,0.6);
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

/************* STATUS INDICATOR *************/
.status{
position:absolute;
top:10px;
right:10px;
width:10px;
height:10px;
border-radius:50%;
background:#22c55e;
box-shadow:0 0 10px #22c55e;
}

/************* CONTROL BAR *************/
.controls{
position:fixed;
bottom:20px;
display:flex;
gap:15px;
background:rgba(30,41,59,0.9);
padding:12px 20px;
border-radius:30px;
box-shadow:0 8px 20px rgba(0,0,0,0.5);
}

/************* CONTROL BUTTON *************/
.control-btn{
width:48px;
height:48px;
border:none;
border-radius:50%;
background:#334155;
color:white;
font-size:18px;
cursor:pointer;
transition:0.2s;
}

.control-btn:hover{
background:#475569;
transform:scale(1.1);
}

/************* END CALL BUTTON *************/
.end{
background:#dc2626;
}

.end:hover{
background:#b91c1c;
}

/************* MOBILE *************/
@media(max-width:700px){

.video-container{
flex-direction:column;
}

video{
width:90vw;
}

}

</style>

</head>

<body>

<header>

<h2>WebRTC Video Call</h2>

<div class="room-box">

<input id="room" placeholder="Room ID">

<button class="join-btn" onclick="joinRoom()">
Join
</button>

</div>

</header>

<div class="video-container">

<div class="video-card">

<div class="status"></div>

<video id="localVideo" autoplay muted playsinline></video>

<div class="label">You</div>

</div>

<div class="video-card">

<video id="remoteVideo" autoplay playsinline></video>

<div class="label">Friend</div>

</div>

</div>

<div class="controls">

<button id="muteBtn" class="control-btn">🎤</button>

<button id="screenBtn" class="control-btn">🖥</button>

<button id="cutBtn" class="control-btn end">📞</button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
