<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC Video Call</title>

<style>

/**************** PAGE ****************/
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
display:flex;
flex-direction:column;
height:100vh;
}

/**************** HEADER ****************/
header{
padding:20px;
}

header h2{
margin:5px;
}

/**************** ROOM INPUT ****************/
.room-box{
margin-top:10px;
}

#room{
padding:10px;
border-radius:8px;
border:none;
outline:none;
}

.join-btn{
padding:10px 18px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
}

.join-btn:hover{
background:#1d4ed8;
}

/**************** VIDEO AREA ****************/
.video-container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
padding:20px;
}

/**************** VIDEO CARD ****************/
.video-card{
position:relative;
background:black;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,0.6);
}

video{
width:420px;
max-width:45vw;
border-radius:12px;
}

/**************** MIRROR LOCAL CAMERA ****************/
#localVideo{
transform:scaleX(-1);
}

/**************** LABEL ****************/
.label{
position:absolute;
bottom:10px;
left:10px;
background:rgba(0,0,0,0.6);
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

/**************** CONTROL BAR ****************/
.controls{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:15px;
background:#1e293b;
padding:12px 20px;
border-radius:30px;
}

/**************** BUTTON STYLE ****************/
.control-btn{
width:50px;
height:50px;
border:none;
border-radius:50%;
background:#334155;
color:white;
font-size:18px;
cursor:pointer;
transition:0.2s;
}

.control-btn:hover{
background:#475569;
transform:scale(1.1);
}

/**************** END CALL BUTTON ****************/
.end{
background:#dc2626;
}

.end:hover{
background:#b91c1c;
}

/**************** MOBILE ****************/
@media(max-width:700px){

.video-container{
flex-direction:column;
}

video{
width:90vw;
}

}

</style>

</head>

<body>

<header>

<h2>WebRTC Video Call</h2>

<div class="room-box">

<input id="room" placeholder="Room ID">

<button class="join-btn" onclick="joinRoom()">
Join
</button>

</div>

</header>


<div class="video-container">

<div class="video-card">

<video id="localVideo" autoplay muted playsinline></video>
<div class="label">You</div>

</div>

<div class="video-card">

<video id="remoteVideo" autoplay playsinline></video>
<div class="label">Friend</div>

</div>

</div>


<div class="controls">

<button id="muteBtn"
class="control-btn"
onclick="toggleMute()">
🎤
</button>

<button id="screenBtn"
class="control-btn"
onclick="toggleScreenShare()">
🖥
</button>

<button id="cutBtn"
class="control-btn end"
onclick="endCall()">
📞
</button>

</div>


<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
